<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QwickDeskSolutions | Login & Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .hidden-section { display: none !important; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center px-4 py-8 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-fixed">

    <div class="w-full max-w-md space-y-6">
        
        <!-- LOGIN / SIGNUP CARD -->
        <div id="authCard" class="glass p-8 rounded-2xl shadow-2xl">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">QwickDesk</h1>
                <p class="text-blue-400 text-xs tracking-widest uppercase mt-1">Client Portal & Dashboard</p>
            </div>
            
            <form id="authForm" class="space-y-4">
                <div>
                    <label class="block text-gray-400 text-xs uppercase mb-1 font-semibold">Business Email</label>
                    <input type="email" id="email" class="w-full px-4 py-3 rounded-lg bg-gray-800/60 border border-gray-700 focus:border-blue-500 outline-none text-white text-sm" placeholder="client@business.com" required>
                </div>
                <div>
                    <label class="block text-gray-400 text-xs uppercase mb-1 font-semibold">Password</label>
                    <input type="password" id="password" class="w-full px-4 py-3 rounded-lg bg-gray-800/60 border border-gray-700 focus:border-blue-500 outline-none text-white text-sm" placeholder="••••••••" required>
                </div>
                <button type="submit" id="authBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg shadow-lg shadow-blue-500/30 transition text-sm">Secure Login / Register</button>
            </form>

            <div class="flex items-center my-5"><div class="flex-grow border-t border-gray-700"></div><span class="px-3 text-gray-500 text-xs">OR</span><div class="flex-grow border-t border-gray-700"></div></div>
            
            <button id="googleBtn" class="w-full bg-white hover:bg-gray-100 text-gray-900 font-bold py-3 rounded-lg flex justify-center items-center gap-2 transition text-sm shadow">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg> Continue with Google
            </button>
        </div>

        <!-- PLAN SELECTION CARD -->
        <div id="planCard" class="glass p-6 rounded-2xl shadow-2xl hidden-section space-y-4">
            <h2 class="text-xl font-bold text-white text-center">Select Your Growth Plan</h2>
            <p class="text-xs text-gray-400 text-center">Choose the package that fits your local business.</p>
            
            <div class="space-y-3">
                <div onclick="selectPlan('Starter SaaS Portal', 4999)" class="p-4 rounded-xl border border-gray-700 bg-gray-800/40 hover:border-blue-500 cursor-pointer transition">
                    <div class="flex justify-between items-center"><h3 class="font-bold text-white">Starter SaaS Portal</h3><span class="text-blue-400 font-bold">₹4,999</span></div>
                    <p class="text-xs text-gray-400 mt-1">Lead trackers, basic analytics & manual invoicing.</p>
                </div>
                <div onclick="selectPlan('Pro Business Suite', 9999)" class="p-4 rounded-xl border border-blue-500 bg-blue-900/20 cursor-pointer transition">
                    <div class="flex justify-between items-center"><h3 class="font-bold text-white">Pro Business Suite</h3><span class="text-emerald-400 font-bold">₹9,999</span></div>
                    <p class="text-xs text-gray-300 mt-1">Advanced referrals, custom domain & priority support.</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase SDK & Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Yahan apiKey theek kar di gayi hai (S aur O ke sath)
        const firebaseConfig = {
            apiKey: "AIzaSyBJTSXKOBcMt3uoJENxDqjvl1xfO4K1XDM",
            authDomain: "qwickdesksolutions.firebaseapp.com",
            projectId: "qwickdesksolutions",
            storageBucket: "qwickdesksolutions.firebasestorage.app",
            messagingSenderId: "508191640643",
            appId: "1:508191640643:web:42576f5d75aafea9ef58f6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docRef = doc(db, "clients", user.uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && docSnap.data().planSelected) {
                    window.location.href = "dashboard.html";
                } else {
                    document.getElementById('authCard').classList.add('hidden-section');
                    document.getElementById('planCard').classList.remove('hidden-section');
                }
            }
        });

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                try {
                    await createUserWithEmailAndPassword(auth, email, password);
                } catch (err2) {
                    alert("Auth Error: " + err2.message);
                }
            }
        });

        document.getElementById('googleBtn').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, googleProvider);
            } catch (err) {
                alert("Google Login Error: " + err.message);
            }
        });

        window.selectPlan = async (planName, amount) => {
            const user = auth.currentUser;
            if(!user) return;
            await setDoc(doc(db, "clients", user.uid), {
                email: user.email,
                name: user.displayName || user.email.split('@')[0],
                planName: planName,
                planAmount: amount,
                planSelected: true,
                status: "Pending Payment",
                wallet: 0,
                createdAt: new Date().toISOString()
            }, { merge: true });
            window.location.href = "dashboard.html";
        };
    </script>
</body>
</html>
