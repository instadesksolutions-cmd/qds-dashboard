<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QwickDesk CRM Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-dark min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="glass p-6 rounded-3xl flex justify-between items-center border border-gray-700/50 shadow-2xl">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-red-600/20 border border-red-500/50 rounded-xl flex items-center justify-center">
                    <i class="fas fa-shield-alt text-red-400 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-white">QwickDesk CRM</h1>
                    <p class="text-gray-400 text-sm">Super Admin Control Panel</p>
                </div>
            </div>
            <button id="logoutBtn" class="bg-gray-800 hover:bg-gray-700 px-5 py-2.5 rounded-xl font-bold text-sm border border-gray-600 transition flex items-center gap-2"><i class="fas fa-power-off"></i> Logout</button>
        </div>

        <!-- Data Table -->
        <div class="glass rounded-3xl overflow-hidden border border-gray-700/50 shadow-2xl">
            <div class="p-6 border-b border-gray-800 bg-gray-900/50 flex justify-between items-center">
                <h2 class="text-lg font-bold text-white"><i class="fas fa-users text-blue-400 mr-2"></i> Client Database</h2>
                <button onclick="loadClients()" class="text-sm text-blue-400 hover:text-white transition"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-300">
                    <thead class="text-xs text-gray-400 uppercase bg-gray-900/80 border-b border-gray-800">
                        <tr>
                            <th class="px-6 py-4 font-bold tracking-wider">Client Details</th>
                            <th class="px-6 py-4 font-bold tracking-wider">Purchased Plan</th>
                            <th class="px-6 py-4 font-bold tracking-wider">Payment UTR</th>
                            <th class="px-6 py-4 font-bold tracking-wider">System Status</th>
                            <th class="px-6 py-4 font-bold tracking-wider text-right">Admin Action</th>
                        </tr>
                    </thead>
                    <tbody id="clientTableBody" class="divide-y divide-gray-800">
                        <!-- Data injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const ADMIN_EMAIL = 'qwickdesksolutions@outlook.com';

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                if (user.email !== ADMIN_EMAIL) {
                    alert("Unauthorized Security Breach. Only Super Admin allowed.");
                    window.location.href = 'dashboard.html';
                    return;
                }
                loadClients();
            } else { window.location.href = 'login.html'; }
        });

        window.loadClients = async () => {
            const tbody = document.getElementById('clientTableBody');
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-8 text-gray-500"><i class="fas fa-spinner fa-spin mr-2"></i> Fetching client data...</td></tr>';
            const querySnapshot = await getDocs(collection(db, "clients"));
            let html = '';
            
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                
                // Status Styling Logic
                let statusBadge = '';
                if(data.status === 'Active') statusBadge = '<span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full text-xs font-bold"><i class="fas fa-check-circle mr-1"></i> Active</span>';
                else if (data.status === 'Pending Verification') statusBadge = '<span class="px-3 py-1 bg-yellow-500/20 text-yellow-400 border border-yellow-500/30 rounded-full text-xs font-bold animate-pulse"><i class="fas fa-clock mr-1"></i> Pending Verification</span>';
                else statusBadge = '<span class="px-3 py-1 bg-gray-700/50 text-gray-400 border border-gray-600 rounded-full text-xs font-bold">Basic (No Plan)</span>';

                // Action Button Logic
                let actionBtn = '';
                if(data.status === 'Pending Verification') {
                    actionBtn = `<button onclick="approveClient('${docSnap.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-lg shadow-emerald-500/30 transition float-right">Approve <i class="fas fa-check ml-1"></i></button>`;
                } else {
                    actionBtn = `<span class="text-gray-600 text-xs font-bold float-right uppercase tracking-wider"><i class="fas fa-lock text-gray-700 mr-1"></i> Locked</span>`;
                }

                html += `
                <tr class="hover:bg-gray-800/30 transition group">
                    <td class="px-6 py-5">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-gray-800 rounded-full flex items-center justify-center text-gray-400 font-bold border border-gray-700">${data.email.charAt(0).toUpperCase()}</div>
                            <div>
                                <p class="font-bold text-white">${data.name || 'Unknown'}</p>
                                <p class="text-xs text-gray-500">${data.email}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-5">
                        <p class="font-bold text-gray-300">${data.planName || '--'}</p>
                        <p class="text-xs text-emerald-500 font-mono">₹${data.planAmount || '0'}</p>
                    </td>
                    <td class="px-6 py-5">
                        <p class="font-mono text-sm text-yellow-300 bg-yellow-500/10 inline-block px-2 py-1 rounded border border-yellow-500/20">${data.utr || 'No Data'}</p>
                    </td>
                    <td class="px-6 py-5">${statusBadge}</td>
                    <td class="px-6 py-5">${actionBtn}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
        };

        window.approveClient = async (uid) => {
            if(confirm("Confirm UTR match with Bank? Activate Premium Plan?")) {
                await updateDoc(doc(db, "clients", uid), { status: "Active" });
                loadClients(); // Reload Table
            }
        };

        document.getElementById('logoutBtn').addEventListener('click', () => { signOut(auth).then(() => window.location.href='index.html'); });
    </script>
</body>
</html>
