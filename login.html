<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Access | QwickDesk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-dark min-h-screen flex">
    
    <!-- Left Side Image (Desktop Only) -->
    <div class="hidden lg:flex lg:w-1/2 bg-cover bg-center relative" style="background-image: url('https://images.unsplash.com/photo-1551434678-e076c223a692?q=80&w=2340&auto=format&fit=crop');">
        <div class="absolute inset-0 bg-gradient-to-r from-gray-950 via-gray-900/80 to-transparent"></div>
        <div class="relative z-10 p-16 flex flex-col justify-center h-full">
            <h1 class="text-5xl font-bold text-white mb-6 leading-tight">Manage Your Web Project in <span class="text-blue-500">Real-Time.</span></h1>
            <p class="text-gray-300 text-lg max-w-md">Login to access your QwickDesk dashboard, track build progress, and communicate directly with our developers.</p>
        </div>
    </div>

    <!-- Right Side Login -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-4 md:p-8 relative">
        <div class="absolute inset-0 bg-pattern opacity-50 lg:hidden"></div>
        
        <div class="w-full max-w-md glass p-6 md:p-10 rounded-3xl shadow-2xl relative z-10 border border-gray-700">
            <div class="text-center mb-8 md:mb-10">
                <div class="w-14 h-14 md:w-16 md:h-16 bg-blue-600/20 border border-blue-500/50 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-lock text-blue-400 text-xl md:text-2xl"></i>
                </div>
                <h2 class="text-2xl md:text-3xl font-bold text-white mb-2">Welcome Back</h2>
                <p class="text-gray-400 text-xs md:text-sm">Sign in to your client workspace</p>
            </div>
            
            <button id="googleBtn" type="button" class="w-full bg-white hover:bg-gray-100 text-gray-950 font-bold py-3.5 rounded-xl flex justify-center items-center gap-3 transition text-sm shadow mb-6">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google"> Continue with Google
            </button>

            <div class="flex items-center my-6"><div class="flex-grow border-t border-gray-700"></div><span class="px-4 text-gray-500 text-[10px] md:text-xs font-semibold tracking-widest uppercase">Or email</span><div class="flex-grow border-t border-gray-700"></div></div>

            <form id="authForm" class="space-y-4 md:space-y-5">
                <div>
                    <label class="block text-gray-400 text-[10px] md:text-xs font-bold uppercase tracking-wide mb-2">Business Email</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-4 top-3.5 text-gray-500"></i>
                        <input type="email" id="email" class="w-full pl-11 pr-4 py-3 rounded-xl bg-gray-900/50 border border-gray-700 focus:border-blue-500 focus:bg-gray-900 focus:ring-1 focus:ring-blue-500 outline-none text-white transition text-sm" placeholder="name@company.com" required>
                    </div>
                </div>
                <div>
                    <label class="block text-gray-400 text-[10px] md:text-xs font-bold uppercase tracking-wide mb-2">Password (Min 6 chars)</label>
                    <div class="relative">
                        <i class="fas fa-key absolute left-4 top-3.5 text-gray-500"></i>
                        <input type="password" id="password" minlength="6" class="w-full pl-11 pr-4 py-3 rounded-xl bg-gray-900/50 border border-gray-700 focus:border-blue-500 focus:bg-gray-900 focus:ring-1 focus:ring-blue-500 outline-none text-white transition text-sm" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-3.5 md:py-4 rounded-xl shadow-lg shadow-blue-500/30 transition text-sm mt-4">Secure Login / Create Account</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { auth, db, provider } from './firebase-config.js';
        import { signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithRedirect, getRedirectResult, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Handle Google Redirect Result
        getRedirectResult(auth).catch((error) => {
            alert("Google Login Failed: " + error.message);
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('submitBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading Dashboard...';
                
                try {
                    // EXACT ADMIN EMAIL MATCH (Check spelling carefully)
                    if(user.email === 'qwickdesksolutions@outlook.com') { 
                        window.location.href = 'admin.html'; 
                        return; 
                    }
                    
                    const docRef = doc(db, "clients", user.uid);
                    const docSnap = await getDoc(docRef);
                    const pendingPlan = localStorage.getItem('selectedPlan');
                    const pendingAmount = localStorage.getItem('selectedAmount');
                    
                    if (!docSnap.exists()) {
                        if (pendingPlan) {
                            await setDoc(docRef, { email: user.email, name: user.displayName || 'Client', planName: pendingPlan, planAmount: pendingAmount, status: "Pending Payment", createdAt: new Date().toISOString() });
                            localStorage.removeItem('selectedPlan');
                            window.location.href = 'payment.html';
                        } else { 
                            await setDoc(docRef, { email: user.email, status: "Basic", createdAt: new Date().toISOString() }); 
                            window.location.href = 'dashboard.html'; 
                        }
                    } else {
                        if(docSnap.data().status === 'Pending Payment') window.location.href = 'payment.html';
                        else window.location.href = 'dashboard.html';
                    }
                } catch (error) {
                    alert("Database Error: " + error.message + "\n\n(Bhai Firebase console mein jake 'Firestore Database' create par click karna zaroori hai!)");
                    document.getElementById('submitBtn').innerHTML = 'Secure Login / Create Account';
                }
            }
        });

        // Google Login Trigger
        document.getElementById('googleBtn').addEventListener('click', () => {
            document.getElementById('googleBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connecting to Google...';
            signInWithRedirect(auth, provider);
        });
        
        // Email/Password Login Trigger
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking Credentials...';
            
            const email = document.getElementById('email').value; 
            const password = document.getElementById('password').value;
            
            try { 
                await signInWithEmailAndPassword(auth, email, password); 
            } catch (error) { 
                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                    try { 
                        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating New Account...';
                        await createUserWithEmailAndPassword(auth, email, password); 
                    } catch (err2) { 
                        alert("Signup Error: " + err2.message); 
                        btn.innerHTML = originalText;
                    }
                } else {
                    alert("Login Error: " + error.message);
                    btn.innerHTML = originalText;
                }
            }
        });
    </script>
</body>
</html>
