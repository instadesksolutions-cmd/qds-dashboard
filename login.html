<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login | QwickDeskSolutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-pattern flex items-center justify-center min-h-screen p-4">
    
    <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="glass p-8 md:p-10 rounded-3xl w-full max-w-md relative z-10 shadow-2xl border border-gray-800">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-emerald-400 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-blue-500/30 mb-4">
                <i class="fas fa-lock text-white text-2xl"></i>
            </div>
            <h2 class="text-3xl font-bold text-white mb-2">Welcome Back</h2>
            <p class="text-gray-400 text-sm">Sign in to your client workspace</p>
        </div>

        <button id="googleLogin" class="w-full bg-white hover:bg-gray-100 text-black font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-3 transition shadow-lg mb-6">
            <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" class="w-5 h-5" alt="Google">
            Continue with Google
        </button>

        <div class="flex items-center my-6">
            <div class="flex-grow border-t border-gray-700"></div>
            <span class="px-4 text-xs text-gray-500 font-semibold tracking-wider">SECURE PORTAL</span>
            <div class="flex-grow border-t border-gray-700"></div>
        </div>

        <p class="text-center text-xs text-gray-500 mt-6">By signing in, you agree to our Terms of Service & Privacy Policy.</p>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const ADMIN_EMAIL = 'qwickdesksolutions@outlook.com';

        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (user.email === ADMIN_EMAIL) window.location.href = 'admin.html';
                else window.location.href = 'dashboard.html';
            }
        });

        document.getElementById('googleLogin').addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                const userRef = doc(db, "clients", user.uid);
                const docSnap = await getDoc(userRef);
                
                if (!docSnap.exists() && user.email !== ADMIN_EMAIL) {
                    await setDoc(userRef, {
                        name: user.displayName,
                        email: user.email,
                        status: "Basic",
                        createdAt: new Date()
                    });
                }
            } catch (error) { alert("Login Failed: " + error.message); }
        });
    </script>
</body>
</html>
